name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    js:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: js

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: js/package-lock.json

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Install ANTLR
              working-directory: .
              run: |
                  wget -q https://www.antlr.org/download/antlr-4.13.2-complete.jar -O /tmp/antlr.jar
                  echo '#!/bin/bash' > /tmp/antlr4
                  echo 'java -jar /tmp/antlr.jar "$@"' >> /tmp/antlr4
                  chmod +x /tmp/antlr4
                  sudo mv /tmp/antlr4 /usr/local/bin/antlr4

            - name: Install dependencies
              run: npm ci

            - name: Create grammar symlink
              run: ln -s ../grammar grammar

            - name: Clean up generated files
              working-directory: .
              run: |
                  find grammar -type f \( -name "*.ts" -o -name "*.interp" -o -name "*.tokens" \) -delete || true
                  rm -f js/web/bundles/parser.bundle.js js/web/bundles/parser.bundle.min.js js/web/bundles/parser.bundle.min.js.map
                  rm -f js/web/bundles/ui.bundle.js js/web/bundles/ui.bundle.min.js js/web/bundles/ui.bundle.min.js.map
                  rm -rf js/output

            - name: Generate grammar
              run: |
                  chmod +x ./scripts/generate-grammar.sh
                  ./scripts/generate-grammar.sh

            - name: Verify grammar generation
              working-directory: .
              run: |
                  if [ ! -f "grammar/IconScriptLexer.ts" ]; then
                      echo "Error: grammar was not created."
                      exit 1
                  fi

            - name: Build parser
              run: npm run build:parser:min

            - name: Verify parser build
              run: |
                  if [ ! -f "web/bundles/parser.bundle.min.js" ]; then
                      echo "Error: parser.bundle.min.js was not created."
                      exit 1
                  fi

            - name: Build CLI
              run: |
                  rm -rf dist
                  npm run build:cli

            - name: Verify CLI build
              run: |
                  if [ ! -f "dist/cli/generate-svg.js" ]; then
                      echo "Error: dist/cli/generate-svg.js was not created."
                      exit 1
                  fi

            - name: Create SVG icons (test)
              run: |
                  mkdir -p output/main
                  npm run generate -- test/main.iconscript output/main

            - name: Verify SVG icons creation
              run: |
                  if [ ! -d "output/main" ] || [ -z "$(ls -A output/main)" ]; then
                      echo "Error: output directory was not created or is empty."
                      exit 1
                  fi

            - name: Build library
              run: |
                  rm -rf dist
                  npm run build:lib

            - name: Verify library build
              run: |
                  if [ ! -f "dist/src/parser.js" ]; then
                      echo "Error: dist/src/parser.js was not created."
                      exit 1
                  fi
                  if [ ! -f "dist/src/parser.d.ts" ]; then
                      echo "Error: dist/src/parser.d.ts was not created."
                      exit 1
                  fi

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Check ESLint for TypeScript files
              run: npm run lint:ts

            - name: Check ESLint for HTML files
              run: npm run lint:html

            - name: Check Stylelint for CSS files
              run: npm run lint:css

    rust:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Install ANTLR
              run: |
                  curl -L -o rust/antlr4rust.jar https://github.com/rrevenantt/antlr4rust/releases/download/antlr4-4.8-2-Rust0.3.0-beta/antlr4-4.8-2-SNAPSHOT-complete.jar

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Generate grammar
              run: |
                  chmod +x ./generate_parser.sh
                  ./generate_parser.sh
              working-directory: rust

            - name: Run Rust tests
              run: cargo test
              working-directory: rust
